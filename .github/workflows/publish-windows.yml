name: Publish signed SaveHUB Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      SAVEHUB_PUBLISHER_NAME: ${{ vars.SAVEHUB_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure official signed release source
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:SAVEHUB_PUBLISHER_NAME) { throw 'Set CSC_LINK certificate secret and SAVEHUB_PUBLISHER_NAME repository variable first.' }
          $releaseParts = $env:GITHUB_REPOSITORY.Split('/')
          node scripts/configure-updates.cjs $releaseParts[0] $releaseParts[1] $env:SAVEHUB_PUBLISHER_NAME
      - run: npm test
      - run: npx electron-builder --win nsis --x64 --publish always
