name: Build and publish desktop packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v4.4.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            script: dist:win
            files: '*.exe'
          - name: macOS Apple Silicon
            runner: macos-15
            script: dist:mac:arm64
            files: '*.dmg *.zip'
          - name: macOS Intel
            runner: macos-15-intel
            script: dist:mac:x64
            files: '*.dmg *.zip'
          - name: Linux x64
            runner: ubuntu-24.04
            script: dist:linux:x64
            files: '*.AppImage *.deb'
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            script: dist:linux:arm64
            files: '*.AppImage *.deb'
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate version and release
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!=="v"+p.version) throw Error("Release tag must match package.json version")'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
      - name: Build packages
        run: npm run ${{ matrix.script }} -- --publish never
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaveHUB-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
      - name: Upload to GitHub release
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb)
          if [ "${#packages[@]}" -eq 0 ]; then echo "No release packages found"; exit 1; fi
          gh release upload "$RELEASE_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --clobber
